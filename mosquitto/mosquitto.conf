# Dev only: anonymous access. Task 7 (stretch) asks you to lock this down.
listener 1883
allow_anonymous true
persistence false

# How many QoS 1 messages the broker queues per offline persistent-session client.
# The default (1000) is too small: 20 simulated devices fill it in under a minute while the
# worker is stopped, and everything after that is silently dropped.
max_queued_messages 100000
